repositories:
  # M0 environment mirror. Replace with your corporate mirror or remove to use defaults.
  - id: mavenCentral
    url: https://repo.huaweicloud.com/repository/maven
  - id: mavenGoogle
    url: https://repo.huaweicloud.com/repository/maven

product:
  type: kmp/lib
  platforms: [ android, iosArm64, iosSimulatorArm64 ]

dependencies:
  - //core
  - //matrix
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.miuix.core
  - $libs.miuix.ui
  - $libs.miuix.preference
  - $libs.miuix.icons
  - $libs.miuix.blur
  - $libs.miuix.squircle
  - $libs.miuix.nav
  - $libs.miuix.shader

dependencies@android:
  - $compose.uiTooling
  - $libs.androidx.activity.compose

settings:
  compose:
    enabled: true
    resources:
      packageName: top.s0cl.cinny.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
